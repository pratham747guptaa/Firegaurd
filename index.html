<script>

/* =========================================================
   FIREGUARD — FUNCTIONAL SCRIPT
   Keeps the existing UI unchanged.

   LIVE DATA:
   - NASA VIIRS thermal anomaly layer
   - Open-Meteo weather
   - Open-Meteo elevation
   - OSRM road routing

   IMPORTANT:
   The NASA layer is an observed thermal-anomaly layer.
   It is NOT a scientifically confirmed fire perimeter.
========================================================= */


/* =========================================================
   DEFAULT LOCATION
========================================================= */

const DEFAULT_LOCATION = {
    lat: 28.6139,
    lon: 77.2090
};


/* =========================================================
   NASA GIBS
========================================================= */

const NASA_GIBS_WMS =
    "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi";

const NASA_FIRE_LAYER =
    "VIIRS_NOAA20_Thermal_Anomalies_375m_All";


/* =========================================================
   STATE
========================================================= */

let map = null;

let selectedMarker = null;

let spreadCircle = null;

let routeLine = null;

let alternativeRouteLine = null;

let destinationMarker = null;

let selectedLat =
    DEFAULT_LOCATION.lat;

let selectedLon =
    DEFAULT_LOCATION.lon;

let destinationLat = null;

let destinationLon = null;

let selectedFire = false;


/* =========================================================
   HELPERS
========================================================= */

function el(id) {

    return document.getElementById(id);

}


function setStatus(
    message,
    type = ""
) {

    const status =
        el("status");

    if (!status) {
        return;
    }

    status.textContent =
        message;

    status.className =
        type
            ? "status-" + type
            : "";

}


/* =========================================================
   NASA FIRE LAYER
========================================================= */

function addNASAFireLayer() {

    const today =
        new Date()
            .toISOString()
            .slice(0, 10);


    const fireLayer =
        L.tileLayer.wms(

            NASA_GIBS_WMS,

            {

                layers:
                    NASA_FIRE_LAYER,

                format:
                    "image/png",

                transparent:
                    true,

                version:
                    "1.3.0",

                time:
                    today,

                opacity:
                    0.90,

                attribution:
                    "NASA GIBS / VIIRS"

            }

        );


    fireLayer.addTo(map);

}


/* =========================================================
   MAP
========================================================= */

function initMap() {

    map =
        L.map("map")
            .setView(
                [
                    DEFAULT_LOCATION.lat,
                    DEFAULT_LOCATION.lon
                ],
                6
            );


    /*
       Base map
    */

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,

            attribution:
                "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);


    /*
       Live NASA fire layer
    */

    addNASAFireLayer();


    /*
       Map click behavior
    */

    map.on(
        "click",
        async function(event) {

            const lat =
                event.latlng.lat;

            const lon =
                event.latlng.lng;


            /*
               First click:
               choose the observed fire location.
            */

            if (!selectedFire) {

                await selectFireLocation(
                    lat,
                    lon
                );

                return;

            }


            /*
               Second click:
               choose evacuation destination.
            */

            selectDestination(
                lat,
                lon
            );

        }
    );

}


/* =========================================================
   SELECT FIRE
========================================================= */

async function selectFireLocation(
    lat,
    lon
) {

    selectedFire = true;

    selectedLat =
        lat;

    selectedLon =
        lon;


    /*
       Remove old fire marker.
    */

    if (selectedMarker) {

        map.removeLayer(
            selectedMarker
        );

    }


    if (spreadCircle) {

        map.removeLayer(
            spreadCircle
        );

    }


    /*
       RED FIRE POINT
    */

    selectedMarker =
        L.circleMarker(
            [
                lat,
                lon
            ],
            {
                radius: 9,

                color: "#ffffff",

                weight: 2,

                fillColor: "#ff3028",

                fillOpacity: 1
            }
        )
        .addTo(map);


    selectedMarker
        .bindPopup(

            "<b>SELECTED FIRE LOCATION</b><br><br>" +

            "Latitude: " +
            lat.toFixed(5) +

            "<br>" +

            "Longitude: " +
            lon.toFixed(5) +

            "<br><br>" +

            "<span style='color:#ff4d4d'>" +
            "NASA VIIRS THERMAL ANOMALY" +
            "</span><br><br>" +

            "This is the selected location inside " +
            "the visible satellite thermal-anomaly layer. " +
            "It is not claimed to be the exact ignition point."

        )
        .openPopup();


    /*
       375 m-class observation footprint.
       This is NOT simulated fire growth.
    */

    spreadCircle =
        L.circle(
            [
                lat,
                lon
            ],
            {
                radius: 190,

                color:
                    "#ff3028",

                fillColor:
                    "#ff3028",

                fillOpacity:
                    0.15,

                weight:
                    1
            }
        )
        .addTo(map);


    /*
       Existing UI update
    */

    if (el("alertTitle")) {

        el("alertTitle")
            .textContent =
            "SATELLITE FIRE LOCATION";

    }


    if (el("alertText")) {

        el("alertText")
            .textContent =
            "Fire observation selected. Click another location to set the evacuation destination.";

    }


    if (el("routeText")) {

        el("routeText")
            .textContent =
            "Select an evacuation destination on the map.";

    }


    /*
       Get live conditions at selected fire.
    */

    await loadLocationData(
        lat,
        lon
    );


    setStatus(
        "Fire location selected. Click a destination outside the fire area.",
        "ok"
    );

}


/* =========================================================
   SELECT DESTINATION
========================================================= */

function selectDestination(
    lat,
    lon
) {

    destinationLat =
        lat;

    destinationLon =
        lon;


    /*
       Remove previous destination.
    */

    if (destinationMarker) {

        map.removeLayer(
            destinationMarker
        );

    }


    /*
       GREEN DESTINATION
    */

    destinationMarker =
        L.circleMarker(
            [
                lat,
                lon
            ],
            {
                radius: 7,

                color: "#ffffff",

                weight: 2,

                fillColor: "#45e08a",

                fillOpacity: 1
            }
        )
        .addTo(map);


    destinationMarker
        .bindPopup(

            "<b>EVACUATION DESTINATION</b><br><br>" +

            "Latitude: " +
            lat.toFixed(5) +

            "<br>" +

            "Longitude: " +
            lon.toFixed(5)

        )
        .openPopup();


    if (el("routeText")) {

        el("routeText")
            .textContent =
            "Destination selected. Click GENERATE EVACUATION ROUTE.";

    }


    setStatus(
        "Destination selected.",
        "ok"
    );

}


/* =========================================================
   LIVE WEATHER + ELEVATION
========================================================= */

async function loadLocationData(
    lat,
    lon
) {

    setStatus(
        "Loading live weather and terrain..."
    );


    if (el("dataMode")) {

        el("dataMode")
            .textContent =
            "LOADING";

    }


    const weatherURL =

        "https://api.open-meteo.com/v1/forecast" +

        "?latitude=" +
        encodeURIComponent(lat) +

        "&longitude=" +
        encodeURIComponent(lon) +

        "&current=" +

        "temperature_2m," +
        "relative_humidity_2m," +
        "wind_speed_10m," +
        "wind_direction_10m," +
        "precipitation" +

        "&past_days=7" +

        "&forecast_days=1" +

        "&hourly=temperature_2m" +

        "&temperature_unit=celsius" +

        "&wind_speed_unit=kmh" +

        "&timezone=auto";


    const elevationURL =

        "https://api.open-meteo.com/v1/elevation" +

        "?latitude=" +
        encodeURIComponent(lat) +

        "&longitude=" +
        encodeURIComponent(lon);


    try {

        const responses =
            await Promise.all([
                fetch(weatherURL),
                fetch(elevationURL)
            ]);


        if (
            !responses[0].ok ||
            !responses[1].ok
        ) {

            throw new Error(
                "API request failed"
            );

        }


        const weather =
            await responses[0].json();


        const terrain =
            await responses[1].json();


        const current =
            weather.current;


        const temperature =
            Number(
                current.temperature_2m
            );


        const humidity =
            Number(
                current.relative_humidity_2m
            );


        const wind =
            Number(
                current.wind_speed_10m
            );


        const direction =
            Number(
                current.wind_direction_10m
            );


        const elevation =
            Number(
                terrain.elevation[0]
            );


        /*
           Update existing UI
        */

        if (el("temperature")) {

            el("temperature")
                .textContent =
                temperature.toFixed(1) +
                " °C";

        }


        if (el("wind")) {

            el("wind")
                .textContent =
                wind.toFixed(1) +
                " km/h";

        }


        if (el("windDirection")) {

            el("windDirection")
                .textContent =
                direction +
                "°";

        }


        if (el("humidity")) {

            el("humidity")
                .textContent =
                humidity +
                " %";

        }


        if (el("elevation")) {

            el("elevation")
                .textContent =
                Math.round(elevation) +
                " m";

        }


        if (el("dataMode")) {

            el("dataMode")
                .textContent =
                "LIVE";

        }


        /*
           Popup
        */

        if (selectedMarker) {

            selectedMarker
                .bindPopup(

                    "<b>FIREGUARD LIVE DATA</b><br><br>" +

                    "Temperature: " +
                    temperature.toFixed(1) +
                    " °C<br>" +

                    "Wind: " +
                    wind.toFixed(1) +
                    " km/h<br>" +

                    "Wind direction: " +
                    direction +
                    "°<br>" +

                    "Humidity: " +
                    humidity +
                    "%<br>" +

                    "Elevation: " +
                    Math.round(elevation) +
                    " m<br>" +

                    "Precipitation: " +
                    Number(
                        current.precipitation
                    ).toFixed(1) +
                    " mm"

                )
                .openPopup();

        }


        /*
           Keep the existing risk UI alive,
           but this is environmental risk rather
           than a fake "probability of fire".
        */

        calculateEnvironmentalRisk(
            temperature,
            humidity,
            wind,
            Number(
                current.precipitation
            )
        );


        setStatus(
            "Live environmental data loaded.",
            "ok"
        );

    }
    catch (error) {

        console.error(error);

        if (el("dataMode")) {

            el("dataMode")
                .textContent =
                "ERROR";

        }

        setStatus(
            "Unable to load live data.",
            "error"
        );

    }

}


/* =========================================================
   ENVIRONMENTAL RISK
========================================================= */

function calculateEnvironmentalRisk(
    temperature,
    humidity,
    wind,
    precipitation
) {

    /*
       Environmental risk score.

       This is NOT a claimed percentage chance
       that a fire will occur.
    */

    let score = 0;


    if (temperature >= 42) {

        score += 35;

    }
    else if (temperature >= 37) {

        score += 28;

    }
    else if (temperature >= 32) {

        score += 20;

    }
    else if (temperature >= 27) {

        score += 10;

    }
    else {

        score += 2;

    }


    if (humidity <= 15) {

        score += 30;

    }
    else if (humidity <= 25) {

        score += 24;

    }
    else if (humidity <= 35) {

        score += 15;

    }
    else if (humidity <= 50) {

        score += 6;

    }


    if (wind >= 45) {

        score += 25;

    }
    else if (wind >= 30) {

        score += 18;

    }
    else if (wind >= 20) {

        score += 10;

    }
    else if (wind >= 10) {

        score += 4;

    }


    if (precipitation >= 5) {

        score -= 25;

    }
    else if (precipitation >= 2) {

        score -= 15;

    }
    else if (precipitation >= 0.5) {

        score -= 5;

    }


    score =
        Math.max(
            0,
            Math.min(
                100,
                Math.round(score)
            )
        );


    /*
       Existing metric.
    */

    if (el("risk")) {

        el("risk")
            .textContent =
            score +
            " / 100";

    }


    if (el("riskBar")) {

        el("riskBar")
            .style.width =
            score +
            "%";

    }


    /*
       Existing alert panel.
    */

    if (score >= 70) {

        if (el("alertTitle")) {

            el("alertTitle")
                .textContent =
                "VERY HIGH ENVIRONMENTAL RISK";

        }

        if (el("alertText")) {

            el("alertText")
                .textContent =
                "Current temperature, humidity, wind and precipitation indicate very high environmental fire-risk conditions.";

        }

    }
    else if (score >= 45) {

        if (el("alertTitle")) {

            el("alertTitle")
                .textContent =
                "ELEVATED ENVIRONMENTAL RISK";

        }

        if (el("alertText")) {

            el("alertText")
                .textContent =
                "Current environmental conditions are elevated. Continue monitoring actual satellite fire detections.";

        }

    }
    else {

        if (el("alertTitle")) {

            el("alertTitle")
                .textContent =
                "LOWER ENVIRONMENTAL RISK";

        }

        if (el("alertText")) {

            el("alertText")
                .textContent =
                "Current environmental conditions are comparatively lower.";

        }

    }

}


/* =========================================================
   HAVERSINE DISTANCE
========================================================= */

function haversineDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R =
        6371;


    const dLat =
        (
            lat2 -
            lat1
        ) *
        Math.PI /
        180;


    const dLon =
        (
            lon2 -
            lon1
        ) *
        Math.PI /
        180;


    const a =

        Math.sin(
            dLat / 2
        ) *
        Math.sin(
            dLat / 2
        )

        +

        Math.cos(
            lat1 *
            Math.PI /
            180
        )

        *

        Math.cos(
            lat2 *
            Math.PI /
            180
        )

        *

        Math.sin(
            dLon / 2
        ) *
        Math.sin(
            dLon / 2
        );


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(
                1 - a
            )
        );


    return R * c;

}


/* =========================================================
   ROUTE FIRE EXPOSURE
========================================================= */

function routeExposure(
    geometry
) {

    if (!selectedFire) {

        return 999999;

    }


    let exposure = 0;


    const coordinates =
        geometry.coordinates;


    coordinates.forEach(
        function(point) {

            const lon =
                point[0];

            const lat =
                point[1];


            const distance =
                haversineDistance(
                    selectedLat,
                    selectedLon,
                    lat,
                    lon
                );


            /*
               Very close to fire:
               huge penalty.
            */

            if (distance < 0.5) {

                exposure += 100;

            }
            else if (distance < 1) {

                exposure += 30;

            }
            else if (distance < 2) {

                exposure += 10;

            }

        }
    );


    return exposure;

}


/* =========================================================
   GENERATE REAL ROAD EVACUATION ROUTE
========================================================= */

async function generateEvacuationRoute() {

    if (!selectedFire) {

        alert(
            "First click the fire location on the map."
        );

        return;

    }


    if (
        destinationLat === null ||
        destinationLon === null
    ) {

        alert(
            "Now click the destination where people should evacuate."
        );

        return;

    }


    setStatus(
        "Calculating real road routes..."
    );


    const url =

        "https://router.project-osrm.org/route/v1/driving/" +

        selectedLon +
        "," +
        selectedLat +

        ";" +

        destinationLon +
        "," +
        destinationLat +

        "?alternatives=true" +

        "&overview=full" +

        "&geometries=geojson";


    try {

        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "OSRM request failed"
            );

        }


        const result =
            await response.json();


        if (
            result.code !== "Ok" ||
            !result.routes ||
            result.routes.length === 0
        ) {

            throw new Error(
                "No routes found"
            );

        }


        /*
           Delete previous route.
        */

        if (routeLine) {

            map.removeLayer(
                routeLine
            );

            routeLine =
                null;

        }


        if (alternativeRouteLine) {

            map.removeLayer(
                alternativeRouteLine
            );

            alternativeRouteLine =
                null;

        }


        /*
           Analyze route alternatives.
        */

        const routes =
            result.routes.map(
                function(route) {

                    return {

                        route,

                        exposure:
                            routeExposure(
                                route.geometry
                            ),

                        distance:
                            route.distance /
                            1000,

                        time:
                            route.duration /
                            60

                    };

                }
            );


        /*
           Best route:
           lowest exposure first,
           then shortest travel time.
        */

        routes.sort(
            function(a, b) {

                if (
                    a.exposure !==
                    b.exposure
                ) {

                    return (
                        a.exposure -
                        b.exposure
                    );

                }


                return (
                    a.time -
                    b.time
                );

            }
        );


        const best =
            routes[0];


        /*
           Draw recommended route.
        */

        routeLine =
            L.geoJSON(
                best.route.geometry,
                {
                    style: {

                        color:
                            "#19d3ff",

                        weight:
                            7,

                        opacity:
                            0.95

                    }
                }
            )
            .addTo(map);


        /*
           Draw alternative route.
        */

        if (
            routes.length > 1
        ) {

            const alternative =
                routes[1];


            alternativeRouteLine =
                L.geoJSON(
                    alternative.route.geometry,
                    {
                        style: {

                            color:
                                "#ffd34e",

                            weight:
                                4,

                            opacity:
                                0.8,

                            dashArray:
                                "8 8"

                        }
                    }
                )
                .addTo(map);

        }


        /*
           Existing route panel.
        */

        if (el("routeText")) {

            el("routeText")
                .innerHTML =

                "<b>RECOMMENDED EVACUATION ROUTE</b><br><br>" +

                "Distance: " +
                best.distance.toFixed(1) +
                " km<br>" +

                "Estimated travel time: " +
                Math.round(
                    best.time
                ) +
                " min<br><br>" +

                "<span style='color:#19d3ff'>" +
                "LOWER FIRE-EXPOSURE ROUTE SELECTED" +
                "</span><br><br>" +

                "The prototype compares available road alternatives and prioritizes the route with the lowest proximity to the selected fire observation.";

        }


        /*
           Fit map.
        */

        map.fitBounds(
            routeLine.getBounds(),
            {
                padding:
                    [30, 30]
            }
        );


        setStatus(
            "Real road evacuation route generated.",
            "ok"
        );

    }
    catch (error) {

        console.error(
            error
        );


        setStatus(
            "Could not generate evacuation route.",
            "error"
        );

    }

}


/* =========================================================
   ANALYZE BUTTON
========================================================= */

if (
    el("analyzeBtn")
) {

    el("analyzeBtn")
        .addEventListener(
            "click",
            function() {

                loadLocationData(
                    selectedLat,
                    selectedLon
                );

            }
        );

}


/* =========================================================
   ROUTE BUTTON
========================================================= */

if (
    el("routeBtn")
) {

    el("routeBtn")
        .addEventListener(
            "click",
            generateEvacuationRoute
        );

}


/* =========================================================
   USE MY LOCATION
========================================================= */

if (
    el("locateBtn")
) {

    el("locateBtn")
        .addEventListener(
            "click",
            function() {

                if (
                    !navigator.geolocation
                ) {

                    setStatus(
                        "Geolocation is not supported.",
                        "error"
                    );

                    return;

                }


                setStatus(
                    "Requesting your location..."
                );


                navigator.geolocation.getCurrentPosition(

                    function(position) {

                        const lat =
                            position.coords.latitude;

                        const lon =
                            position.coords.longitude;


                        selectedLat =
                            lat;

                        selectedLon =
                            lon;


                        map.setView(
                            [
                                lat,
                                lon
                            ],
                            12
                        );


                        /*
                           If a fire has already been selected,
                           use the current location as destination.
                        */

                        if (
                            selectedFire
                        ) {

                            selectDestination(
                                lat,
                                lon
                            );

                        }
                        else {

                            showSelectedLocation();

                            loadLocationData(
                                lat,
                                lon
                            );

                        }

                    },

                    function() {

                        setStatus(
                            "Location permission was denied or unavailable.",
                            "error"
                        );

                    }

                );

            }
        );

}


/* =========================================================
   EXISTING SELECTED MARKER FUNCTION
   Kept for compatibility with your current UI.
========================================================= */

function showSelectedLocation() {

    if (selectedMarker) {

        map.removeLayer(
            selectedMarker
        );

    }


    selectedMarker =
        L.marker(
            [
                selectedLat,
                selectedLon
            ]
        )
        .addTo(map);


    selectedMarker
        .bindPopup(

            "<b>SELECTED LOCATION</b><br><br>" +

            "Latitude: " +
            selectedLat.toFixed(4) +

            "<br>" +

            "Longitude: " +
            selectedLon.toFixed(4)

        )
        .openPopup();

}


/* =========================================================
   START
========================================================= */

initMap();


/*
   Load live environmental data for the
   default map position without selecting
   it as a fire.
*/

loadLocationData(
    selectedLat,
    selectedLon
);

</script>
